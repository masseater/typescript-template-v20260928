name: typescript-template-local
services:
  otlp:
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3200:3200"
    environment:
      ENABLE_LOGS_OTELCOL: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - otlp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:13133/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "200"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit,template-mailpit.local
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - mailpit-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  mailpit-data:
  otlp-data:
